name: Build DylibLoader
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          mkdir -p output
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib -O2 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -o output/DylibLoader.dylib \
            src/DylibLoader.m \
            -framework Foundation -framework UIKit \
            -install_name @rpath/DylibLoader.dylib
          file output/DylibLoader.dylib
          otool -l output/DylibLoader.dylib | grep -A8 LC_BUILD_VERSION || true
          ls -la output/
      - uses: actions/upload-artifact@v4
        with:
          name: DylibLoader-dylib
          path: output/DylibLoader.dylib
          retention-days: 30
